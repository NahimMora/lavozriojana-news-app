<!doctype html>
<html lang="es-AR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>La Voz Riojana · Comparativa editorial</title>
<style>body{margin:0;padding:24px;font:16px/1.5 system-ui;color:#111827;background:#eef0f2}h1{font:600 32px Georgia;margin:0 0 12px}p{max-width:850px}label{display:inline-block;margin:0 20px 20px 0}select{font:inherit;padding:8px;border:1px solid #9ca3af}main{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{font-weight:600;padding:12px 0}img{width:100%;height:auto;display:block;background:#fff;box-shadow:0 2px 12px #0001}@media(max-width:700px){main{grid-template-columns:1fr}body{padding:16px}}</style>
<h1>La Voz Riojana · Rediseño editorial</h1>
<p>Comparación local con el mismo contenido de prueba. Los textos son ficticios y las fotografías son referencias públicas; estas capturas no representan noticias publicadas. No se usó una base de producción.</p>
<label>Página <select id="page"><option value="home">Portada</option><option value="article">Artículo</option><option value="category">Categoría</option></select></label>
<label>Ancho <select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option><option>360</option></select> px</label>
<main><figure><figcaption>Antes</figcaption><a id="before-link"><img id="before" alt="Diseño anterior"></a></figure><figure><figcaption>Después</figcaption><a id="after-link"><img id="after" alt="Rediseño editorial"></a></figure></main>
<script>const page=document.getElementById('page'),width=document.getElementById('width');function update(){for(const stage of ['before','after']){const src=stage+'/'+page.value+'-'+width.value+'.png';document.getElementById(stage).src=src;document.getElementById(stage+'-link').href=src}}page.onchange=width.onchange=update;update();</script>
</html>
